<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOCUS LOCK</title>
<style>
:root {
	--ink: #15251f;
	--paper: #f3efe4;
	--lime: #d7f36b;
	--coral: #ff765c;
}

* { box-sizing: border-box; }

body {
	margin: 0;
	min-height: 100vh;
	color: var(--ink);
	background:
		radial-gradient(circle at 80% 12%, rgba(215,243,107,.8), transparent 25%),
		linear-gradient(135deg, #f3efe4 0%, #dce8d2 55%, #b8d4c3 100%);
	font-family: Georgia, "Yu Mincho", serif;
}

main {
	width: min(1080px, calc(100% - 40px));
	min-height: 100vh;
	margin: auto;
	padding: 40px 0;
	display: grid;
	align-content: center;
	grid-template-columns: 1.1fr .9fr;
	gap: clamp(40px, 8vw, 110px);
}

.eyebrow {
	margin: 0 0 24px;
	font: 700 12px/1.2 Arial, sans-serif;
	letter-spacing: 3px;
}

h1 {
	max-width: 650px;
	margin: 0;
	font-size: clamp(48px, 8vw, 96px);
	line-height: .92;
	letter-spacing: 0;
}

h1 em { color: var(--coral); font-style: normal; }

.intro {
	max-width: 530px;
	margin: 30px 0 36px;
	font-size: 18px;
	line-height: 1.8;
}

.start {
	display: inline-flex;
	align-items: center;
	gap: 14px;
	padding: 16px 23px;
	color: var(--ink);
	background: var(--lime);
	border: 2px solid var(--ink);
	border-radius: 2px;
	box-shadow: 6px 6px 0 var(--ink);
	font: 700 15px Arial, sans-serif;
	text-decoration: none;
	transition: transform .15s, box-shadow .15s;
}

.start:hover { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--ink); }

.rules {
	padding: 28px;
	background: rgba(255,255,255,.42);
	border: 1px solid rgba(21,37,31,.28);
	border-radius: 2px;
}

.rules h2 { margin: 0 0 20px; font-size: 24px; }
.rules p { margin: 0 0 16px; line-height: 1.7; }
.rules p:last-child { margin-bottom: 0; }
.number { color: var(--coral); font: 700 13px Arial, sans-serif; }

@media (max-width: 700px) {
	main { grid-template-columns: 1fr; padding: 54px 0; }
	h1 { font-size: clamp(50px, 16vw, 78px); }
}
</style>
</head>
<body>
<main>
	<section>
		<p class="eyebrow">FOCUS LOCK / 01</p>
		<h1>時間を決めて、<em>勝つ。</em></h1>
		<p class="intro">勉強する時間を自分で決める。その間に集中を切らしたら、画面はロックされる。今日の自分を、明日の資産に変えよう。</p>
		<a class="start" href="timer.html">タイマーを設定する <span aria-hidden="true">→</span></a>
	</section>
	<aside class="rules">
		<h2>LOCK RULES</h2>
		<p><span class="number">01 /</span> 勉強する時間を入力してスタート。</p>
		<p><span class="number">02 /</span> タイマー画面から離れると、戻ったときにブロック。</p>
		<p><span class="number">03 /</span> 「ブロックされてお金持ちになろう！」の画面で、もう一度集中。</p>
	</aside>
</main>
</body>
</html>
